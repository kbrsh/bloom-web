<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Seismic Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        #bloomCanvas {
            display: block;
            background: #000;
        }

        #paletteImage {
            display: none;
        }

        #paletteSelect {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px;
            font-size: 14px;
        }

        #palettePreview {
            display: none;
            position: absolute;
            top: 40px;
            right: 10px;
            width: 150px;
            border: 2px solid white;
        }

        #paletteSelect:hover + #palettePreview,
        #palettePreview:hover {
            display: block;
        }

        #customUpload {
            position: absolute;
            top: 10px;
            right: 100px;
            font-size: 14px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <canvas id="bloomCanvas"></canvas>

    <select id="paletteSelect">
        <option value="palette1.jpg">Palette 1</option>
        <option value="palette2.jpg" selected>Palette 2</option>
        <option value="palette3.jpg">Palette 3</option>
    </select>
    <img id="palettePreview" src="palette2.jpg" />
    <input type="file" id="customUpload" accept="image/*" />

    <img id="paletteImage" src="palette2.jpg" />

    <script type="module" src="../js/seisplotjs_3.1.4_standalone.mjs"></script>
    <script type="module">
      import { miniseed } from "../js/seisplotjs_3.1.4_standalone.mjs";
      window.miniseed = miniseed;
    </script>
    <script src="bloom.js"></script>
    <script>
        document.getElementById('paletteSelect').onchange = function() {
            document.getElementById('paletteImage').src = this.value;
            document.getElementById('palettePreview').src = this.value;
            bloom.preparePalette('paletteImage');
        };

        document.getElementById('customUpload').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('paletteImage').src = event.target.result;
                    bloom.preparePalette('paletteImage');
                };
                reader.readAsDataURL(file);
            }
        };
    </script>
</body>
</html>
