<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Seismic Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        #bloomCanvas {
            display: block;
            background: #000;
        }

        #paletteImage {
            display: none;
        }

        #paletteBox {
            position: absolute;
            top: 10px;
            right: 10px;
            display: none;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 6px;
            padding: 8px;
            color: #000;
            font-size: 12px;
        }

        #paletteBox.is-open {
            display: block;
        }

        #customUpload {
            font-size: 12px;
        }

        .menuOption {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .menuOption input {
            margin: 0;
        }

        #palettePreview {
            display: block;
            margin-top: 8px;
            width: 150px;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        #snapshotButton {
            margin-top: 8px;
            width: 100%;
            font-size: 12px;
            padding: 6px 8px;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.25);
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="bloomCanvas"></canvas>

    <div id="paletteBox">
        <input type="file" id="customUpload" accept="image/*" />
        <label class="menuOption">
            <input type="checkbox" id="useSyntheticToggle" />
            Use synthetic data
        </label>
        <label class="menuOption">
            <input type="checkbox" id="clampToggle" />
            Show clamp padding
        </label>
        <img id="palettePreview" src="palette4.jpg" alt="Palette preview" />
        <button id="snapshotButton" type="button">Capture snapshot</button>
    </div>
    <img id="paletteImage" src="palette4.jpg" />

    <script type="module" src="../js/seisplotjs_3.1.4_standalone.mjs"></script>
    <script type="module">
      import { miniseed } from "../js/seisplotjs_3.1.4_standalone.mjs";
      window.miniseed = miniseed;
    </script>
    <script src="bloom.js"></script>
    <script>
        document.getElementById('customUpload').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('paletteImage').src = event.target.result;
                    document.getElementById('palettePreview').src = event.target.result;
                    bloom.preparePalette('paletteImage');
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('snapshotButton').onclick = function() {
              bloom.captureSnapshot(2);
        };

        const syntheticToggle = document.getElementById('useSyntheticToggle');
        const clampToggle = document.getElementById('clampToggle');

        syntheticToggle.onchange = function() {
              bloom.useSyntheticData = syntheticToggle.checked;
        };

        clampToggle.onchange = function() {
              bloom.showClampBox = clampToggle.checked;
        };

        window.addEventListener('DOMContentLoaded', () => {
              bloom.useSyntheticData = syntheticToggle.checked;
              bloom.showClampBox = clampToggle.checked;
        });

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f') {
                document.getElementById('paletteBox').classList.toggle('is-open');
            }
        });
    </script>
</body>
</html>
