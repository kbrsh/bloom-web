<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - Seismic Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        #bloomCanvas {
            display: block;
            background: #000;
        }

        #paletteImage {
            display: none;
        }

        #paletteBox {
            position: absolute;
            top: 10px;
            right: 10px;
            display: none;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 6px;
            padding: 8px;
            color: #000;
            font-size: 12px;
        }

        #paletteBox.is-open {
            display: block;
        }

        #customUpload {
            font-size: 12px;
        }

        .stationMeta {
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .stationLabel {
            color: #666;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .menuOption {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .menuOption input {
            margin: 0;
        }

        #palettePreview {
            display: block;
            margin-top: 8px;
            width: 150px;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        #snapshotButton {
            margin-top: 8px;
            width: 100%;
            font-size: 12px;
            padding: 6px 8px;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.25);
            border-radius: 4px;
            cursor: pointer;
        }

        #paletteOverlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
        }

        #paletteOverlay.is-open {
            display: flex;
        }

        #paletteOverlayImage {
            max-width: 95vw;
            max-height: 95vh;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <canvas id="bloomCanvas"></canvas>

    <div id="paletteBox">
        <div class="stationMeta">Station: <span id="stationLabel" class="stationLabel"></span></div>
        <input type="file" id="customUpload" accept="image/*" />
        <label class="menuOption">
            <input type="checkbox" id="clampToggle" />
            Show boundaries
        </label>
        <img id="palettePreview" src="palettes/Jean-LaMarr-Going Back to the Rez, 1974.jpg" alt="Palette preview" />
        <button id="snapshotButton" type="button">Capture snapshot</button>
    </div>
    <img id="paletteImage" src="palettes/Jean-LaMarr-Going Back to the Rez, 1974.jpg" />
    <div id="paletteOverlay">
        <img id="paletteOverlayImage" src="palettes/Jean-LaMarr-Going Back to the Rez, 1974.jpg" alt="Palette full screen" />
    </div>

    <script type="module" src="../js/seisplotjs_3.1.4_standalone.mjs"></script>
    <script type="module">
      import { miniseed } from "../js/seisplotjs_3.1.4_standalone.mjs";
      window.miniseed = miniseed;
    </script>

    <script src="bloom.js"></script>
    <script>
        const paletteImage = document.getElementById('paletteImage');
        const paletteOverlay = document.getElementById('paletteOverlay');
        const paletteOverlayImage = document.getElementById('paletteOverlayImage');
        const palettePreview = document.getElementById('palettePreview');
        const PALETTE_ROTATION_INTERVAL_MS = 60 * 1000;
        const PALETTE_FILES = [
            'palettes/Jean-LaMarr-Going Back to the Rez, 1974.jpg',
            'palettes/Phyllis-Shafer-Hope Valley Morning, 2007.jpg',
            'palettes/Maynard-Dixon-Edge of the Amargosa Desert, 1927.jpg',
            'palettes/Sandow-Birk-The Rape of the Sierra (Logging and Mining Lake Tahoe in the 1860s), 2020.jpeg',
            'palettes/Chester-Arnold-Fin du Siecle, 1992.jpg',
        ];
        let currentPaletteIndex = 0;
        let paletteRequestId = 0;

        function applyPalette(src) {
            const requestId = ++paletteRequestId;
            const loader = new Image();

            loader.onload = () => {
                if (requestId !== paletteRequestId) return;

                paletteImage.src = src;
                palettePreview.src = src;
                paletteOverlayImage.src = src;
                document.body.dataset.palette = src;
                bloom.preparePalette('paletteImage');
            };

            loader.onerror = () => {
                console.error(`Unable to load palette: ${src}`);
            };

            loader.src = src;
        }

        function startPaletteRotation() {
            document.body.dataset.palette = PALETTE_FILES[currentPaletteIndex];

            // Warm the browser cache so later palette changes happen promptly.
            PALETTE_FILES.slice(1).forEach((src) => {
                const image = new Image();
                image.src = src;
            });

            setInterval(() => {
                currentPaletteIndex = (currentPaletteIndex + 1) % PALETTE_FILES.length;
                applyPalette(PALETTE_FILES[currentPaletteIndex]);
            }, PALETTE_ROTATION_INTERVAL_MS);
        }

        document.getElementById('stationLabel').textContent = STATION.label;

        document.getElementById('customUpload').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    // Prevent a palette load already in flight from replacing this upload.
                    paletteRequestId += 1;
                    paletteImage.src = event.target.result;
                    palettePreview.src = event.target.result;
                    paletteOverlayImage.src = event.target.result;
                    bloom.preparePalette('paletteImage');
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('snapshotButton').onclick = function() {
              bloom.captureSnapshot(2);
        };

        const clampToggle = document.getElementById('clampToggle');

        clampToggle.onchange = function() {
              bloom.showClampBox = clampToggle.checked;
        };

        window.addEventListener('DOMContentLoaded', () => {
              bloom.showClampBox = clampToggle.checked;
              startPaletteRotation();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f') {
                document.getElementById('paletteBox').classList.toggle('is-open');
            } else if (e.key.toLowerCase() === 'l') {
                paletteOverlay.classList.toggle('is-open');
            }
        });
    </script>
</body>
</html>
